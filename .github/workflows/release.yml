name: Release

# Cut a release by pushing a tag that matches the version, e.g.:
#   git tag v0.3.0 && git push origin v0.3.0
# This builds the sdist + wheel, publishes to PyPI via OIDC trusted publishing
# (no stored token), and opens a GitHub release with the built artifacts.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard — tag matches package version
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          version="$(python -c 'import huntkit; print(huntkit.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          echo "package=$version  tag=$tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match huntkit.__version__ ($version)"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Check the artifacts
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The PyPI project must register this repo+environment as a trusted
    # publisher (https://docs.pypi.org/trusted-publishers/). No token is stored.
    environment:
      name: pypi
      url: https://pypi.org/p/huntkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            See [CHANGELOG.md](https://github.com/Raresney/HuntKit/blob/main/CHANGELOG.md) for the full notes.
