name: Docker image

# Build the full-toolchain image and push it to the GitHub Container Registry.
# Fires on the same version tags as the PyPI release, so a tagged release ships
# both `pip install huntkit` and a ready-to-run image; `workflow_dispatch` lets
# the current version's image be (re)published on demand. GHCR auth uses the
# built-in GITHUB_TOKEN — no stored registry credentials.
#
#   docker pull ghcr.io/raresney/huntkit:latest
#   docker run --rm ghcr.io/raresney/huntkit doctor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/raresney/huntkit

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version and image tags
        id: ver
        run: |
          v="$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('huntkit/__init__.py').read()).group(1))")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "huntkit $v (ref_type=$GITHUB_REF_TYPE)"
          # Always publish the version-pinned tag. Only move :latest for a real
          # version tag — a workflow_dispatch from an older ref must never drag
          # :latest backward to a stale image.
          tags="$IMAGE:$v"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags="$tags"$'\n'"$IMAGE:latest"
          fi
          {
            echo "tags<<__TAGS__"
            echo "$tags"
            echo "__TAGS__"
          } >> "$GITHUB_OUTPUT"

      - name: Guard — tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::tag v$tag does not match package version ${{ steps.ver.outputs.version }}"
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
