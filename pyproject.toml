[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "huntkit"
version = "0.2.0"
description = "Local-first bug bounty recon, methodology & workflow framework for authorised testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raresney" }]
keywords = ["bugbounty", "recon", "security", "pentest", "cli", "osint", "framework"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = ["httpx>=0.27"]          # optional: cloud AI providers
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
# The v0.2 Typer app is the entry point, reachable as both `huntkit` and
# `python -m huntkit`. It reached parity with the legacy CLI once the `scan`
# command landed (recon/scan/analyze/report/advise); the old flat `cli.py` is
# kept importable but no longer wired to the console script.
huntkit = "huntkit.app.main:run"

[project.urls]
Homepage = "https://github.com/Raresney/HuntKit"
Repository = "https://github.com/Raresney/HuntKit"
Issues = "https://github.com/Raresney/HuntKit/issues"

[tool.setuptools.packages.find]
include = ["huntkit*"]

[tool.setuptools.package-data]
huntkit = ["py.typed", "data/**/*"]

# ---- tooling -------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# E501: the formatter owns line length. B008: typer.Option()/Argument() in
# defaults is the framework idiom. UP045: keep Optional[...] so Typer can
# evaluate command annotations on Python 3.9. SIM105: the stdout-reconfigure
# try/except/pass is clearer than contextlib.suppress here.
ignore = ["E501", "B008", "UP045", "SIM105"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["huntkit"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
